name: Mise à jour quotidienne NDVI Sentinel-2

on:
  schedule:
    # Exécution tous les jours à 6h00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Permet l'exécution manuelle

jobs:
  update-ndvi:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout du repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3.0'
    
    - name: Cache les packages R
      uses: actions/cache@v3
      with:
        path: ~/R/libs
        key: ${{ runner.os }}-r-${{ hashFiles('**/DESCRIPTION') }}
        restore-keys: |
          ${{ runner.os }}-r-
    
    - name: Installer les dépendances système
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgdal-dev \
          libgeos-dev \
          libproj-dev \
          libudunits2-dev \
          libcurl4-openssl-dev \
          libssl-dev \
          libxml2-dev \
          libharfbuzz-dev \
          libfribidi-dev
    
    - name: Installer les packages R
      run: |
        Rscript -e "
          options(repos = c(CRAN = 'https://cloud.r-project.org'))
          install_if_missing <- function(pkg) {
            if (!require(pkg, character.only = TRUE, quietly = TRUE)) {
              install.packages(pkg, dependencies = TRUE)
            }
          }
          packages <- c('rstac', 'terra', 'sf', 'ggplot2', 'ggspatial')
          for (pkg in packages) {
            install_if_missing(pkg)
          }
        "
    
    - name: Vérifier et extraire le NDVI le plus récent
      id: extract_ndvi
      run: |
        Rscript check_and_extract_ndvi.R
      continue-on-error: false
    
    - name: Créer la carte NDVI
      if: steps.extract_ndvi.outcome == 'success'
      run: |
        Rscript carte_ndvi.R
    
    - name: Vérifier les changements
      id: verify_changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        git diff --staged --quiet || echo "changes=true" >> $GITHUB_OUTPUT
    
    - name: Commit et push les changements
      if: steps.verify_changes.outputs.changes == 'true'
      run: |
        git commit -m "Mise à jour automatique NDVI - $(date +'%Y-%m-%d %H:%M:%S')"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Notification - Aucune nouvelle image
      if: steps.verify_changes.outputs.changes != 'true'
      run: |
        echo "Aucune nouvelle image Sentinel-2 disponible ou déjà à jour."
