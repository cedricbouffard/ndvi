name: Mise à jour quotidienne NDVI Sentinel-2

on:
  schedule:
    # Exécution tous les jours à 6h00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Permet l'exécution manuelle

jobs:
  update-ndvi:
    runs-on: ubuntu-latest
    # Utiliser l'image rocker/geospatial qui contient R + librairies spatiales pré-installées
    container:
      image: rocker/geospatial:4.3.0
      
    steps:
    - name: Checkout du repository
      uses: actions/checkout@v4
    
    - name: Cache les packages R
      uses: actions/cache@v3
      with:
        path: /usr/local/lib/R/site-library
        key: ${{ runner.os }}-r-geospatial-${{ hashFiles('**/DESCRIPTION', '**/*.R') }}
        restore-keys: |
          ${{ runner.os }}-r-geospatial-
    
    - name: Installer les packages R manquants
      run: |
        Rscript -e "
          options(repos = c(CRAN = 'https://cloud.r-project.org'))
          packages <- c('rstac', 'ggspatial')
          install.packages(packages, dependencies = TRUE, Ncpus = 2)
        "
    
    - name: Vérifier et extraire le NDVI le plus récent
      id: extract_ndvi
      run: |
        Rscript check_and_extract_ndvi.R
      continue-on-error: false
    
    - name: Créer la carte NDVI
      if: steps.extract_ndvi.outcome == 'success'
      run: |
        Rscript carte_ndvi.R
    
    - name: Vérifier les changements
      id: verify_changes
      run: |
        git config --global --add safe.directory /__w/ndvi/ndvi
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        git add -A
        git diff --staged --quiet || echo "changes=true" >> $GITHUB_OUTPUT
    
    - name: Commit et push les changements
      if: steps.verify_changes.outputs.changes == 'true'
      run: |
        git commit -m "Mise à jour automatique NDVI - $(date +'%Y-%m-%d %H:%M:%S')"
        git push
    
    - name: Notification - Aucune nouvelle image
      if: steps.verify_changes.outputs.changes != 'true'
      run: |
        echo "Aucune nouvelle image Sentinel-2 disponible ou déjà à jour."
